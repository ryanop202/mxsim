<meta charset="utf-8">
<title>Habillage USLAND v12</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Barlow:wght@400;600&display=swap">
<style>
/* Layout: one full-width 3D stage under a team-coloured header, scene tabs, then the checks for the scene shown. */
:root {
  --bg: #0d1024; --panel: #161a36; --line: #2a3060; --fg: #eef0f8; --muted: #9aa1c4;
  --navy: #161b3a; --red: #e11e3c; --ok: #3ccf8e; --warn: #f2b33d;
  --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --body: "Barlow", "Segoe UI", Arial, sans-serif;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 28px; max-width: 1200px; margin: 0 auto; display: grid; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
h1 { font-family: var(--display); font-style: italic; font-weight: 800; font-size: clamp(28px, 6vw, 44px); line-height: 1; margin: 0; letter-spacing: .01em; text-wrap: balance; }
h1 span { color: var(--red); }
.sub { color: var(--muted); margin: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tabs button { font: 700 italic 17px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; color: var(--fg); background: var(--panel); border: 1px solid var(--line); padding: 10px 14px; border-radius: 3px; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--red); border-color: var(--red); }
.tabs button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.stage { position: relative; width: 100%; height: min(68vh, 640px); min-height: 340px; background: var(--navy); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; touch-action: none; }
.stage canvas { display: block; width: 100%; height: 100%; }
.hint { position: absolute; left: 10px; bottom: 8px; font-size: 12px; color: var(--muted); background: rgba(13,16,36,.7); padding: 3px 8px; border-radius: 3px; pointer-events: none; }
.info { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; min-width: 0; }
.card h2 { font: 700 italic 18px/1.1 var(--display); text-transform: uppercase; letter-spacing: .05em; margin: 0 0 6px; }
.card p { margin: 0; color: var(--muted); }
.chk { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.chk:last-child { border-bottom: 0; }
.pill { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 10px; white-space: nowrap; }
.pill.ok { background: color-mix(in srgb, var(--ok) 22%, transparent); color: var(--ok); }
.pill.warn { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); }
.note { color: var(--muted); font-size: 13px; }
</style>

<div class="wrap">
  <header>
    <h1>USLAND <span>v12</span> habillage</h1>
    <p class="sub">Aperçu avant mise en jeu · modèles faits maison · non testé en jeu</p>
  </header>
  <nav class="tabs" id="tabs" aria-label="Scènes"></nav>
  <div class="stage" id="stage"><div class="hint">Glisser pour tourner · pincer / molette pour zoomer · 2 doigts pour déplacer</div></div>
  <section class="info" id="info"></section>
  <p class="note">Rendu simplifié dans le navigateur (lumière, ombres et matériaux du jeu différents). Unités : pieds (ft), comme dans MX Simulator.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const DATA = /*DATA*/null;
const b64 = (s, T) => { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new T(u.buffer); };

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.outputEncoding = THREE.sRGBEncoding;
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fb6d6);
scene.fog = new THREE.Fog(0x9fb6d6, 250, 700);
const camera = new THREE.PerspectiveCamera(45, 1, 0.3, 3000);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.495;
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x6b5a45, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.75); sun.position.set(-0.65, 0.36, 0.67).multiplyScalar(100); scene.add(sun);

const loader = new THREE.TextureLoader(), texCache = {}, geoCache = {};
function tex(n) { if (!texCache[n]) { const t = loader.load(DATA.tex[n], () => render()); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; texCache[n] = t; } return texCache[n]; }
function geo(n) {
  if (!geoCache[n]) {
    const m = DATA.models[n], g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(b64(m.pos, Float32Array), 3));
    g.setAttribute('normal', new THREE.BufferAttribute(b64(m.nrm, Float32Array), 3));
    g.setAttribute('uv', new THREE.BufferAttribute(b64(m.uv, Float32Array), 2));
    g.setIndex(new THREE.BufferAttribute(b64(m.idx, Uint32Array), 1));
    geoCache[n] = g;
  }
  return geoCache[n];
}
// MXS statue: local z axis -> world (-sin a, -cos a)  =>  three rotation.y = a + PI
function statue(o) {
  const mesh = new THREE.Mesh(geo(o.m), new THREE.MeshLambertMaterial({ map: tex(o.t), side: THREE.DoubleSide }));
  mesh.position.set(o.x, o.y, o.z); mesh.rotation.order = 'YXZ'; mesh.rotation.y = o.a + Math.PI;
  if (o.m === 'start_gate') mesh.rotation.x = -(90 + 20) * Math.PI / 180;   // raised like in the game (gate01 is modelled flat)
  return mesh;
}
function terrain(t) {
  const h = b64(t.h, Float32Array), c = b64(t.c, Uint8Array), n = t.nx * t.nz;
  const pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
  for (let i = 0; i < t.nz; i++) for (let j = 0; j < t.nx; j++) {
    const k = i * t.nx + j; pos[3 * k] = t.x0 + j * t.d; pos[3 * k + 1] = h[k]; pos[3 * k + 2] = t.z0 + i * t.d;
    for (let q = 0; q < 3; q++) col[3 * k + q] = Math.pow(c[3 * k + q] / 255, 2.2);
  }
  const idx = [];
  for (let i = 0; i < t.nz - 1; i++) for (let j = 0; j < t.nx - 1; j++) { const a = i * t.nx + j, b = a + 1, d = a + t.nx, e = d + 1; idx.push(a, d, b, b, d, e); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.setIndex(idx); g.computeVertexNormals();
  return new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true }));
}
function person(x, y, z) {           // 6 ft figure for scale
  const g = new THREE.Group(), mat = new THREE.MeshLambertMaterial({ color: 0xff7a1a });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.75, 4.6, 12), mat); body.position.y = 2.3;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.6, 12, 10), mat); head.position.y = 5.4;
  g.add(body, head); g.position.set(x, y, z); return g;
}
function gateFrame(x, y, z, a) {     // simple red start-gate frame (JGSX gate model not shown)
  const g = new THREE.Group(), mat = new THREE.MeshLambertMaterial({ color: 0xc8202a });
  const bar = (w, h, d, px, py, pz) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(px, py, pz); g.add(m); };
  bar(3.2, 0.25, 0.25, 0, 1.6, 0.4); bar(0.25, 1.6, 0.25, -1.5, 0.8, 0.4); bar(0.25, 1.6, 0.25, 1.5, 0.8, 0.4); bar(3.4, 0.2, 1.2, 0, 0.1, 0.2);
  g.position.set(x, y, z); g.rotation.y = a + Math.PI; return g;
}

let world = new THREE.Group(); scene.add(world);
const SCENES = [
  { id: 'paddock', label: 'Paddock' },
  { id: 'arch_SX1', label: 'Arrivée SX1' }, { id: 'arch_SX2', label: 'Arrivée SX2' }, { id: 'arch_SX3', label: 'Arrivée SX3' },
  { id: 'start_SX1', label: 'Départ SX1' },
];
const fmt = v => v.toFixed(1).replace('.', ',');
function card(title, rows, text) {
  const el = document.createElement('div'); el.className = 'card';
  el.innerHTML = `<h2>${title}</h2>` + (text ? `<p>${text}</p>` : '') +
    (rows || []).map(r => `<div class="chk"><span>${r[0]}</span><span>${r[1]} ${r[2] ? `<span class="pill ${r[2]}">${r[2] === 'ok' ? 'OK' : 'à voir'}</span>` : ''}</span></div>`).join('');
  return el;
}
function show(id) {
  scene.remove(world); world = new THREE.Group(); scene.add(world);
  const S = DATA.scenes[id], info = document.getElementById('info'); info.innerHTML = '';
  if (S.terrain) world.add(terrain(S.terrain));
  else { const g = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshLambertMaterial({ color: 0x8a7f72 })); g.rotation.x = -Math.PI / 2; g.position.y = -0.02; world.add(g); }
  S.objs.forEach(o => world.add(statue(o)));
  if (S.gates) S.gates.forEach(g => world.add(gateFrame(g[0], g[1], g[2], g[3])));
  const t = new THREE.Vector3(...S.cam);
  if (id === 'paddock') {
    world.add(person(4, 0, 26)); camera.position.set(-40, 26, 95); controls.target.set(6, 6, 6);
    const r = DATA.team.riders.join(' · ');
    info.append(card('Hospitality', null, `Remorque 2 niveaux comme tes photos : cadre blanc, vitrages gris, module d'entrée avec porte vitrée, escalier, tapis rouge et cordons. USLAND (logo et icône U) à la place de Honda ; RBT, FOX et l'étoile à la place de HRC. Pilotes : ${r}. Coach : ${DATA.team.coach}. ${DATA.team.tag}.`),
                card("Pick-ups", null, "Double cabine surélevé noir comme ta photo : calandre noire, nœud papillon jaune, crochets rouges, jantes noires, élargisseurs d’ailes, marchepieds."),
                card('Bannières', null, '4 bannières 12 × 3 ft (USLAND, icône U, RBT, FOX) pour les grillages autour des pistes.'));
  } else if (id.startsWith('arch')) {
    const A = S.info, f = A.f;
    world.add(person(A.pillars[0][0], A.y, A.pillars[0][1] - 3));
    camera.position.set(A.x - f[0] * 75, A.crest + 22, A.z - f[1] * 75); controls.target.set(A.x, A.y + 22, A.z);
    info.append(card('Portique FINISH', [
      ['Hauteur sous la bâche (depuis la crête)', fmt(A.clearance) + ' ft', A.clearance > 18 ? 'ok' : 'warn'],
      ['Piliers ↔ trajectoire la plus proche', fmt(A.pillar_line_dist) + ' ft', A.pillar_line_dist >= 17 ? 'ok' : 'warn'],
      ['Pente sous les pieds', fmt(A.plate_slope) + ' ft', A.plate_slope <= 0.5 ? 'ok' : 'warn'],
    ]), card('Arche FINISH', null, "Comme ta photo : pieds en trapèze (icône U + USLAND), poteaux RBT / étoile / RBT, poutre FINISH, enseigne icône U + USLAND + SUPERCROSS. Centrée sur la porte d’arrivée, sans collision."));
  } else {
    camera.position.set(t.x - 45, 26, t.z + 38); controls.target.set(t.x - 8, 0, t.z);
    info.append(card('Grates de départ', [['Grilles + grates', '22 + 22', 'ok'], ['Grate', '9,8 ft : 1,5 / 2,7 / 1,5 ft de large', null]],
      "Grilles : plaque noire pleine avec le U, tube rouge. Grates fines en croix comme ta photo : étroite contre la grille, large aux pieds, étroite derrière. Visuel seulement : pas encore de grip spécial."),
      card('Portique de départ', null, "Treillis au-dessus de la grille sur 2 socles, bâches USLAND / RBT / FOX, 14 drapeaux israéliens, enseigne au centre."));
  }
  controls.update(); render();
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.id === id));
}
const tabs = document.getElementById('tabs');
SCENES.forEach(s => { const b = document.createElement('button'); b.textContent = s.label; b.dataset.id = s.id; b.id = 'tab-' + s.id; b.onclick = () => show(s.id); tabs.append(b); });
function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); render(); }
let pending = false;
function render() { if (pending) return; pending = true; requestAnimationFrame(() => { pending = false; controls.update(); renderer.render(scene, camera); }); }
controls.addEventListener('change', render);
window.addEventListener('resize', resize);
const start = (location.hash || '').slice(1);
show(SCENES.some(s => s.id === start) ? start : 'paddock'); resize();
(function loop() { if (controls.enableDamping) { controls.update(); renderer.render(scene, camera); } requestAnimationFrame(loop); })();
</script>
